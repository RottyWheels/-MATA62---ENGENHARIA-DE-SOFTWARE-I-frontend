# Veridt — SPA + proxy reverso para o backend (mesma origem: cookie de sessão + CSRF).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    # Resolve "backend" pelo DNS do Docker em tempo de requisição
    # (o nginx sobe mesmo se o backend ainda não estiver no ar).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; font-src 'self' data:; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Arquivos com hash no nome: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://*.mercadopago.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; font-src 'self' data:; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Fallback da SPA
    location / {
        try_files $uri /index.html;
    }
}
